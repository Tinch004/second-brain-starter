name: Vault audit

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  orphans-and-broken-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar huerfanas y links rotos
        run: |
          find . -name "*.md" -not -path "*/.obsidian/*" -not -path "*/.github/*" \
            | sed -E 's#.*/##; s/\.md$//' | sort -u > /tmp/notes.txt
          find . -name "*.md" -not -path "*/.obsidian/*" -not -path "*/.github/*" -print0 \
            | xargs -0 sed -E 's/`[^`]*`//g' \
            | grep -oE '\[\[[^]|#]+' \
            | sed -E 's/\[\[//; s#.*/##' | sort -u > /tmp/links.txt

          ORPHANS=$(comm -23 /tmp/notes.txt /tmp/links.txt | grep -vE '^(AGENTS|CLAUDE|README|SETUP)$' || true)
          BROKEN=$(comm -13 /tmp/notes.txt /tmp/links.txt || true)

          if [ -n "$ORPHANS" ]; then
            echo "::error::Notas huerfanas (sin ningun link entrante):"
            echo "$ORPHANS"
          fi
          if [ -n "$BROKEN" ]; then
            echo "::error::Links rotos (apuntan a algo que no existe):"
            echo "$BROKEN"
          fi
          if [ -n "$ORPHANS" ] || [ -n "$BROKEN" ]; then
            exit 1
          fi
          echo "Vault limpio: 0 huerfanas, 0 links rotos."

      - name: Verificar nombres de indice de carpeta
        run: |
          # mindepth 2: el README.md de la raiz es la landing page de GitHub, no una nota del vault — excepcion valida.
          BAD=$(find . -mindepth 2 -iname "README.md" -not -path "*/.obsidian/*" -not -path "*/.github/*" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Encontrado README.md dentro de una carpeta — el vault usa <Carpeta>-index.md, nunca README.md:"
            echo "$BAD"
            exit 1
          fi
          echo "OK: ningun README.md suelto dentro de una carpeta del vault."

      - name: Buscar secretos en el vault
        run: |
          PATTERN="AKIA[0-9A-Z]{16}|-----BEGIN[A-Z ]*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|sk_live_[A-Za-z0-9]{20,}|(api[_-]?key|secret|token|password)[[:space:]]*[:=][[:space:]]*[\"'][^\"']{8,}[\"']"

          HITS=$(find . -name "*.md" -not -path "*/.obsidian/*" -not -path "*/.github/*" -print0 \
            | xargs -0 grep -inE "$PATTERN" || true)

          if [ -n "$HITS" ]; then
            echo "::error::Posibles secretos encontrados (nunca deben vivir en el vault, ni en _raw/):"
            echo "$HITS"
            exit 1
          fi
          echo "OK: ningun patron de secreto detectado."

      - name: Chequear salud basica del Work Graph
        run: |
          # Relaciones vivas en el frontmatter de *-status.md (parent/depends-on/blocked-by/related-to/supersedes).
          # Los links rotos ya los cubre el step de arriba (una relacion es un [[link]] mas). Esto solo agrega
          # lo que ese step no puede ver: self-reference y ciclos directos de depends-on (A<->B).
          # Soporta relaciones en YAML flow-style (misma linea) y block-style (lista indentada debajo de la clave).
          # find -print0 + read -d '' (no "for f in $(find ...)") porque este mismo archivo ya evita word-splitting
          # con paths que tienen espacios en los otros steps — mismo criterio aca.
          ERRORS=0
          > /tmp/depends_pairs.txt

          while IFS= read -r -d '' f; do
            name=$(basename "$f" .md)
            fm=$(awk '/^---$/{c++; next} c==1' "$f")

            # Self-reference: cualquier wikilink en cualquier campo de relacion que apunte a la propia nota.
            # No hace falta distinguir de que campo viene — un self-reference es invalido en los 5 por igual.
            all_targets=$(echo "$fm" | grep -oE '\[\[[^]|#]+' | sed -E 's/\[\[//; s#.*/##; s/\|.*//')
            if [ -n "$all_targets" ] && echo "$all_targets" | grep -qxF "$name"; then
              echo "::error::Self-reference en $f: una relacion apunta a si misma ($name)"
              ERRORS=1
            fi

            # depends-on especificamente, para el chequeo de circularidad: capturar la linea de la clave (por si
            # trae el valor inline) mas cualquier linea indentada debajo (lista en block-style), hasta la proxima
            # clave de primer nivel.
            dep_block=$(echo "$fm" | awk '
              /^depends-on:/ { in_dep=1; print; next }
              /^[A-Za-z0-9_-]+:/ { in_dep=0 }
              in_dep && /^[[:space:]]/ { print; next }
            ')
            dep_targets=$(echo "$dep_block" | grep -oE '\[\[[^]|#]+' | sed -E 's/\[\[//; s#.*/##; s/\|.*//')
            for t in $dep_targets; do
              echo "$name|$t" >> /tmp/depends_pairs.txt
            done
          done < <(find . -name "*-status.md" -not -path "*/.obsidian/*" -not -path "*/.github/*" -print0)

          while IFS='|' read -r a b; do
            [ -z "$a" ] && continue
            [ "$a" = "$b" ] && continue  # self-reference ya se reporta arriba, no es un "ciclo" separado
            if grep -qxF "$b|$a" /tmp/depends_pairs.txt; then
              echo "::error::depends-on circular directo entre $a y $b"
              ERRORS=1
            fi
          done < /tmp/depends_pairs.txt

          if [ "$ERRORS" = "1" ]; then
            exit 1
          fi
          echo "OK: sin self-reference ni depends-on circular directo en el Work Graph."

      - name: Memory health (informativo, no bloquea el build)
        run: |
          # TODOs estancados, status posiblemente viejo, decisiones/learnings sin **Estado:**.
          # A diferencia de los steps anteriores, esto NUNCA hace exit 1 -- staleness no es un bug,
          # es una senal para que un agente/usuario la revise cuando corresponda. Nunca se corrige
          # solo: solo se senala (ver "Memory health" en SKILL.md).
          # set +e / +pipefail explicito: el shell default de Actions corre run: con -e -o pipefail,
          # y un grep que no matchea (ej. un item legacy sin fecha -- el caso mas comun, documentado
          # como "se ignora en silencio") mataria el step entero a mitad de camino sin esto. Todo el
          # punto de este step es no abortar nunca, asi que se desactiva para todo el bloque.
          set +e
          set +o pipefail
          HOY=$(date -u +%s)
          UMBRAL_TODOS=30
          UMBRAL_STATUS=60

          echo "--- TODOs en 'Activos' sin fecha reciente (> $UMBRAL_TODOS dias) ---"
          while IFS= read -r -d '' f; do
            awk '/^## Activos/{a=1;next} /^## /{a=0} a' "$f" | grep -E '^- \[ \]' | while IFS= read -r line; do
              # Fecha de alta va SIEMPRE entre parentesis al final de la linea (convencion de _templates/todos-template.md)
              # -- ancla asi para no confundirla con una fecha mencionada en el texto de la tarea.
              d=$(echo "$line" | grep -oE '\([0-9]{4}-[0-9]{2}-[0-9]{2}\)[[:space:]]*$' | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
              [ -z "$d" ] && continue
              ts=$(date -u -d "$d" +%s 2>/dev/null) || continue
              dias=$(( (HOY - ts) / 86400 ))
              if [ "$dias" -gt "$UMBRAL_TODOS" ]; then
                echo "::notice::$f: $dias dias desde la fecha del item -> $line"
              fi
            done
          done < <(find . -name "*-todos.md" -not -path "*/.obsidian/*" -not -path "*/.github/*" -print0)

          echo "--- Status sin actualizar (> $UMBRAL_STATUS dias) ---"
          while IFS= read -r -d '' f; do
            d=$(grep -oE 'Actualizado: *[0-9]{4}-[0-9]{2}-[0-9]{2}' "$f" | head -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
            [ -z "$d" ] && continue
            ts=$(date -u -d "$d" +%s 2>/dev/null) || continue
            dias=$(( (HOY - ts) / 86400 ))
            if [ "$dias" -gt "$UMBRAL_STATUS" ]; then
              echo "::notice::$f: sin actualizar hace $dias dias (Actualizado: $d)"
            fi
          done < <(find . -name "*-status.md" -not -path "*/.obsidian/*" -not -path "*/.github/*" -print0)

          echo "--- Decisiones/learnings sin campo **Estado:** ---"
          # Mismo chequeo estructural para -decisions.md y para los 3 archivos de Experience Learning
          # (<project>-learnings.md, Domain-learnings.md, Workstyle-learnings.md) -- todos usan el mismo
          # patron de entry "## fecha - titulo" + "**Estado:**", asi que el mismo awk sirve para los cuatro.
          while IFS= read -r -d '' f; do
            awk '
              /^## / {
                if (title != "" && !has_estado) print FILENAME": \""title"\" sin **Estado:**"
                title=$0; has_estado=0; next
              }
              /^\*\*Estado:\*\*/ { has_estado=1 }
              END { if (title != "" && !has_estado) print FILENAME": \""title"\" sin **Estado:**" }
            ' "$f"
          done < <(find . \( -name "*-decisions.md" -o -name "*-learnings.md" -o -name "Domain-learnings.md" -o -name "Workstyle-learnings.md" \) -not -path "*/.obsidian/*" -not -path "*/.github/*" -print0)

          echo "Memory health: chequeo informativo completo (no bloquea el build)."
